{- Умный дом: температура и освещение по комнатам -}
(def comfort 22)
(def night 18)
(def lamp @{ power = 60; dimmer = 100; })

@{
  heating = @{
    livingroom = $[comfort];
    bedroom = $[night];
    kitchen = $[comfort];
    outside = -5;
  };
  lighting = @{
    hall = $[lamp];
    kitchen = @{ main = $[lamp]; hood = 15; };
  };
  security = @{ alarm = 1; delay = 30; cameras = 4; };
}