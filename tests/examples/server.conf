{- Конфигурация веб-сервера -}
(def http 80)
(def timeout 30)
(def retries 3)

@{
  server = @{
    port = $[http];
    workers = 4;
    timeout = $[timeout];
  };
  proxy = @{
    port = 8080;
    timeout = $[timeout];
    retries = $[retries];
  };
  limits = @{
    connections = 1000;
    uploadmb = 25;
  };
}