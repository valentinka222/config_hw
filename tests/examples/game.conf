{-
Параметры компьютерной игры:
сложность, герой, враги и мир
-}
(def basehp 100)
(def basespeed 5)
(def hero @{ hp = $[basehp]; speed = $[basespeed]; armor = 10; })

@{
  difficulty = 2;
  hero = $[hero];
  enemy = @{
    hp = 50;
    speed = $[basespeed];
    damage = @{ min = 5; max = 15; };
  };
  world = @{ width = 256; height = 128; gravity = -10; };
}